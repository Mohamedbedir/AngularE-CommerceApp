<div class="card product-card h-100 border-0" appShadow [routerLink]="['/products', product.id]">

    <!-- Product Image -->
    <div class="product-image-wrapper">
        <img [src]="product.pictureURL || fallbackImage" (error)="useFallback($event)"
            class="card-img-top product-image" [alt]="product.name">
    </div>

    <div class="card-body d-flex flex-column">

        <!-- Category + Brand -->
        <div class="d-flex justify-content-between align-items-center mb-2">

            <span class="badge bg-primary bg-opacity-10 text-primary">
                {{ product.category }}
            </span>

            <small class="text-secondary">
                {{ product.brand }}
            </small>

        </div>

        <!-- Product Name -->
        <h5 class="card-title fw-semibold mb-2">
            {{ product.name }}
        </h5>

        <!-- Description -->
        <p class="card-text text-secondary description mb-3">
            {{ product.description | trunc:70 }}
        </p>

        <!-- Price + Button -->
        <div class="mt-auto d-flex justify-content-between align-items-center">

            <strong class="price">
                {{ product.price | currency:'USD':'symbol':'1.0-0' }}
            </strong>

            <a class="btn btn-primary btn-sm" (click)="$event.stopPropagation()" routerLink="/">
                <i class="bi bi-cart-plus me-2"></i> Add To Cart
            </a>

        </div>

    </div>

</div>
